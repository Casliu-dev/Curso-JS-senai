<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chama Burger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="cabecalho-site">
      <nav class="barra-navegacao">
        <a href="#" class="logo">🔥 Burguer-donalds</a>
        <ul class="links-menu" id="linksMenu">
          <li><a href="#cardapio">Cardápio</a></li>
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#depoimentos">Depoimentos</a></li>
          <li><a href="#reserva">Reservar</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
        <a href="#pedir" class="botao botao-nav">Peça agora</a>
        <button class="menu-alternar" id="menuAlternar" aria-label="Abrir menu">
          ☰
        </button>
      </nav>
    </header>

    <main>
      <section class="destaque">
        <div class="destaque-conteudo">
          <div class="destaque-texto">
            <h1>Burger de verdade,<br />na brasa.</h1>
            <p>
              Os melhores ingredientes, dos melhores restaurantes
            </p>
            <a href="#cardapio" class="botao botao-primario"></a>
            <div class="destaque-video">
              <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/41ZP4cSF2_w"
                title="Vídeo Burguer-donalds"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
            <img src="assets/icons/whopper.jpg" alt="">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
